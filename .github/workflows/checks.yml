name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun ci
      # typecheck + lint + format:check
      - run: bun run check
      - run: pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
      # server + packages (bun test --isolate), then dashboard (vitest via --filter)
      - run: bun run test
        env:
          LLMFLOW_PYTHON: python3
      # The only build in this job; later steps reuse apps/server/dist.
      - run: bun run build
      - run: bun run test:package
        env:
          LLMFLOW_REUSE_BUILD: '1'
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
        env:
          LLMFLOW_REUSE_BUILD: '1'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --load \
            --platform ${{ matrix.platform }} \
            --build-arg VERSION="$(jq -r .version apps/server/package.json)" \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f docker/Dockerfile -t llmflow:ci .
      - name: Run container and check /api/health on the documented ports
        run: |
          docker run -d --name llmflow -p 1337:1337 -p 8080:8080 llmflow:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:1337/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:1337/api/health
          curl -sS -o /dev/null -w 'proxy %{http_code}\n' http://127.0.0.1:8080/v1/models
          test "$(docker exec llmflow id -u)" = 1000
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' llmflow:ci)" = "$(jq -r .version apps/server/package.json)"
      - if: failure()
        run: docker logs llmflow
