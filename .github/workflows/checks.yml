name: Checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun ci
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: pip install opentelemetry-sdk opentelemetry-exporter-otlp-proto-http
      - run: bun run test
        env:
          LLMFLOW_PYTHON: python3
      - run: bun run --filter @llmflow/dashboard test
      - run: bun run build
      - run: bun run test:package
      - run: bunx playwright install --with-deps chromium
      - run: bunx playwright test
  docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          docker buildx build --load \
            --platform ${{ matrix.platform }} \
            --build-arg VERSION="$(jq -r .version apps/server/package.json)" \
            --build-arg REVISION=${{ github.sha }} \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -f docker/Dockerfile -t llmflow:ci .
      - name: Run container and check /api/health on the documented ports
        run: |
          docker run -d --name llmflow -p 1337:1337 -p 8080:8080 llmflow:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:1337/api/health && break
            sleep 1
          done
          curl -fsS http://localhost:1337/api/health
          curl -sS -o /dev/null -w 'proxy %{http_code}\n' http://localhost:8080/v1/models
          test "$(docker exec llmflow id -u)" = 1000
          test "$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.version"}}' llmflow:ci)" = "$(jq -r .version apps/server/package.json)"
      - if: failure()
        run: docker logs llmflow
